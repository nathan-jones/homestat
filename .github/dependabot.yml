# Weekly update PRs, grouped so each ecosystem is one PR rather than many.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # RustCrypto and dalek crates share trait crates and must move
      # together, or each PR fails on its own.
      crypto:
        patterns: [aes, ctr, sha1, sha2, hmac, hkdf, chacha20poly1305, "*-dalek", num-bigint]
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
