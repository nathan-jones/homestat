# Standalone deployment. Copy .env.example to .env and fill in what you use;
# leave a source's variables unset to disable it.
services:
  homestat:
    image: ghcr.io/nathan-jones/homestat:latest
    # build: .
    container_name: homestat
    restart: unless-stopped
    network_mode: host # required for HomeKit (mDNS discovery + UDP video)
    volumes:
      - ./data:/data # pairing keys and widgets: back this up
    env_file: .env
