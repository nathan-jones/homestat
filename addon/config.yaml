name: Homestat
version: "0.2.0"
slug: homestat
description: Show Home Assistant, Prometheus and MQTT values as live HomeKit camera widgets
url: https://github.com/nathan-jones/homestat
arch:
  - aarch64
  - amd64
# Prebuilt multi-arch image from CI. Delete this line to build locally from
# the Dockerfile instead (see DOCS.md, "Installing from a private copy").
image: ghcr.io/nathan-jones/homestat
init: false
startup: application
boot: auto
# HomeKit needs mDNS discovery and direct UDP video to the viewer.
host_network: true
homeassistant_api: true
services:
  - mqtt:want
ingress: true
ingress_port: 8099
panel_icon: mdi:chart-box-outline
panel_title: Homestat
options:
  name: Homestat
  port: 51826
  sample_interval: 5
  api_lan_access: false
schema:
  name: str
  port: port
  setup_code: "match(^\\d{3}-\\d{2}-\\d{3}$)?"
  sample_interval: int(1,3600)
  api_lan_access: bool
  prometheus_url: url?
  mqtt_url: str?
